<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Three steps: 1, choose a split. 2, download the Google Drive folder. 3, unzip everything in one place, keeping each video next to its JSON annotation."><title>Three steps: 1, choose a split. 2, download the Google Drive folder. 3, unzip everything in one place, keeping each video next to its JSON annotation.</title><defs></defs><style>.s{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.75" y=".75" width="358.5" height="148.5" rx="18" fill="#0c1626" stroke="#22385a" stroke-width="1.5"/><circle cx="52" cy="75.0" r="26" fill="#5eead4"/><text class="s" x="52" y="84.0" font-size="26" font-weight="800" text-anchor="middle" fill="#04121a">1</text><text class="s" x="94" y="58" font-size="23" font-weight="700" fill="#e6edf3">Choose a split</text><text class="s" x="94" y="88" font-size="17" fill="#93a4b8">Training or public test set,</text><text class="s" x="94" y="112" font-size="17" fill="#93a4b8">via the buttons above.</text><path d="M374 75.0h30M394 65.0l10 10-10 10" fill="none" stroke="#3b5578" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="420.75" y=".75" width="358.5" height="148.5" rx="18" fill="#0c1626" stroke="#22385a" stroke-width="1.5"/><circle cx="472" cy="75.0" r="26" fill="#60a5fa"/><text class="s" x="472" y="84.0" font-size="26" font-weight="800" text-anchor="middle" fill="#04121a">2</text><text class="s" x="514" y="58" font-size="23" font-weight="700" fill="#e6edf3">Download the folder</text><text class="s" x="514" y="88" font-size="17" fill="#93a4b8">In Google Drive, open the</text><text class="s" x="514" y="112" font-size="17" fill="#93a4b8">folder menu → Download.</text><path d="M794 75.0h30M814 65.0l10 10-10 10" fill="none" stroke="#3b5578" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="840.75" y=".75" width="358.5" height="148.5" rx="18" fill="#0c1626" stroke="#22385a" stroke-width="1.5"/><circle cx="892" cy="75.0" r="26" fill="#34d399"/><text class="s" x="892" y="84.0" font-size="26" font-weight="800" text-anchor="middle" fill="#04121a">3</text><text class="s" x="934" y="58" font-size="23" font-weight="700" fill="#e6edf3">Unzip in one place</text><text class="s" x="934" y="88" font-size="17" fill="#93a4b8">Keep each video next to</text><text class="s" x="934" y="112" font-size="17" fill="#93a4b8">its JSON annotation.</text></svg>
